[project]
name = "MWU"
version = "0.16.0"
description = "基于 Vue 的 通用 GUI。由 MaaFramework 强力驱动！"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3,<4",
    "fastapi>=0.139.0",
    "filelock>=3.31.0",
    "httpx>=0.28.1",
    "maafw>=5.11.1",
    "nuitka[all]>=4.1.3",
    "numpy>=2.3.5",
    "pillow>=12.3.0",
    "plyer>=2.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
    "ruff>=0.15.20",
    "pyjson5>=2.0.1",
    "ty>=0.0.56",
    "pywin32>=312; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
